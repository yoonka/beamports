# cargo-about's configuration for THIRD-PARTY-NOTICES.txt, which the release
# workflow puts in each Windows archive. Each program is its own Cargo
# project: run cargo-about with --manifest-path <program>/Cargo.toml.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
