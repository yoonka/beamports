[package]
name = "knotify"
version = "1.1.0"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
notify = "9.0.0"
serde_json = "1.0.145"

# FreeBSD 15.0 added inotify(2). Use it instead of kqueue whatever release the
# build runs on: notify chooses it by itself only in native builds.
[target.'cfg(target_os = "freebsd")'.dependencies]
notify = { version = "9.0.0", features = ["freebsd_inotify"] }

[dev-dependencies]
tempfile = "3.27.0"
